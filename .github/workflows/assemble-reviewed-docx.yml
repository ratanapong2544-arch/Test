name: Assemble reviewed DOCX

on:
  push:
    paths:
      - '.docx_chunks/**'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble when all chunks are present
        shell: bash
        run: |
          set -euo pipefail
          expected=32
          actual=$(find .docx_chunks -maxdepth 1 -type f -name 'part-*' 2>/dev/null | wc -l | tr -d ' ')
          if [ "$actual" -ne "$expected" ]; then
            echo "Waiting for all chunks: $actual/$expected"
            exit 0
          fi
          out='24-04-69 รายงานการประชุมการส่งงาน งวดที่ 41_ตรวจคำผิด.docx'
          cat $(find .docx_chunks -maxdepth 1 -type f -name 'part-*' | sort) | base64 --decode > "$out"
          test -s "$out"
          rm -rf .docx_chunks
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$out" .docx_chunks
          git commit -m 'Add spelling-reviewed meeting report'
          git push
